[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!ZPos "-2"]
MouseScrollUpAction=[!WriteKeyValue Variables S "(Clamp(#S#+0.1,0.5,2.5))"][!Refresh]
MouseScrollDownAction=[!WriteKeyValue Variables S "(Clamp(#S#-0.1,0.5,2.5))"][!Refresh]
ContextTitle=檢查更新
ContextAction=[!CommandMeasure MeasureUpdVersion "Update"]

[Metadata]
Name=放假倒數
Author=Jack
Information=桌面小月曆。上班 10:00–19:00。滑鼠滾輪縮放，右鍵可手動檢查更新。每天自動檢查更新。
Version=自動更新版

[Variables]
; 大小倍率 0.5 ~ 2.5，也可以直接在小工具上滾滑鼠滾輪調整
S=1
; 目前安裝的內容版本（自動更新時會改寫）
LocalVersion=VERSION
RepoRaw=https://raw.githubusercontent.com/jackonthetree-maker/holiday-countdown/main

; ===== 自動更新：開機時檢查一次，之後每天一次 =====
[MeasureUpdVersion]
Measure=WebParser
URL=#RepoRaw#/version.txt
ForceReload=1
RegExp=(?si)^\s*([0-9.]+)
StringIndex=1
UpdateRate=86400
FinishAction=[!CommandMeasure MeasureUpdater "Check()"]

[MeasureDlLua]
Measure=WebParser
URL=#RepoRaw#/skin/HolidayCountdown.lua
Download=1
ForceReload=1
DownloadFile=new_HolidayCountdown.lua
UpdateRate=86400
Disabled=1
FinishAction=[!CommandMeasure MeasureUpdater "Got('lua')"]

[MeasureDlLayout]
Measure=WebParser
URL=#RepoRaw#/skin/Layout.inc
Download=1
ForceReload=1
DownloadFile=new_Layout.inc
UpdateRate=86400
Disabled=1
FinishAction=[!CommandMeasure MeasureUpdater "Got('layout')"]

[MeasureUpdater]
Measure=Script
ScriptFile=#CURRENTPATH#Updater.lua

; ===== 小月曆本體（從 GitHub 下載的最新版）=====
@Include=#CURRENTPATH#DownloadFile\Layout.inc
